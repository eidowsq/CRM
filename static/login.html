<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Northstar CRM 登录</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-page">
  <div class="login-shell">
    <div class="login-art">
      <div class="login-badge">Northstar CRM</div>
      <h1>欢迎回来</h1>
      <p>进入你的销售工作台，继续跟进客户和商机。</p>
    </div>
    <form class="login-card" id="login-form">
      <p class="eyebrow">SIGN IN</p>
      <h2>登录 CRM</h2>
      <label>账号<input name="username" autocomplete="username"></label>
      <label>密码<input name="password" type="password" autocomplete="current-password"></label>
      <button class="primary wide" type="submit">登录</button>
      <p class="login-hint">请输入账号和密码</p>
    </form>
  </div>
  <script src="/js/login.js"></script>
</body>
</html>
